<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Creator</title>
    <!-- TensorFlow.js và MobileNet cho nhận diện ảnh cơ bản (giả lập AI) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@latest"></script>
    <style>
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #00ffcc; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; border: 1px solid #00ffcc; padding: 25px; background: #111; }
        input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; background: #222; color: #0ff; border: 1px solid #0ff; font-family: inherit; }
        button { background: #003d3d; cursor: pointer; font-weight: bold; }
        button:hover { background: #006666; }
        #preview { margin-top: 20px; border: 1px dashed #0ff; min-height: 200px; padding: 15px; background: #1a1a1a; }
        video { max-width: 100%; display: block; margin: 10px auto; border: 2px solid #0ff; }
        .flex-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .flex-row > div { flex: 1; min-width: 200px; }
        .label { color: #ffaa00; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ AI VIDEO GENERATOR ⚡</h1>
    <p><i>// Nhập văn bản + ảnh -> tạo video AI (mô phỏng)</i></p>

    <div class="flex-row">
        <div>
            <span class="label">📝 Văn bản mô tả:</span>
            <textarea id="textInput" rows="4" placeholder="Nhập kịch bản, mô tả hành động, giọng nói...">Robot đang đi bộ trên sao Hỏa, hoàng hôn đỏ rực</textarea>
        </div>
        <div>
            <span class="label">🖼️ Ảnh đầu vào (URL hoặc upload):</span>
            <input type="text" id="imageUrl" placeholder="https://example.com/image.jpg" value="https://picsum.photos/400/300">
            <input type="file" id="fileInput" accept="image/*">
            <button id="loadImageBtn">Tải ảnh lên</button>
        </div>
    </div>

    <div class="flex-row">
        <div>
            <span class="label">🎬 Hiệu ứng / hành động:</span>
            <input type="text" id="actionInput" placeholder="ví dụ: xoay, bay, phóng to, chuyển cảnh" value="xoay tròn và bay lên">
        </div>
        <div>
            <span class="label">⏱️ Thời lượng (giây):</span>
            <input type="number" id="durationInput" value="5" min="1" max="15">
        </div>
    </div>

    <button id="generateBtn">▶️ TẠO VIDEO AI (MÔ PHỎNG)</button>

    <div id="preview">
        <h3>📹 Kết quả video AI:</h3>
        <video id="outputVideo" width="100%" controls autoplay loop>
            <source src="" type="video/mp4">
            Trình duyệt không hỗ trợ video.
        </video>
        <div id="statusText" style="color: #ffaa00; font-size: 0.9em;">Chưa tạo video</div>
        <button id="downloadBtn" style="width: auto; display: none;">⬇️ Tải video xuống</button>
    </div>
</div>

<script>
    // ---------- MÔ PHỎNG AI TẠO VIDEO TỪ VĂN BẢN + ẢNH ----------
    // Sử dụng Canvas để tạo video giả lập với ảnh, text và hiệu ứng.
    // Không gửi dữ liệu ra ngoài, hoàn toàn offline.

    let loadedImage = null;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('outputVideo');
    const statusDiv = document.getElementById('statusText');
    const downloadBtn = document.getElementById('downloadBtn');

    // Load ảnh từ URL
    document.getElementById('loadImageBtn').addEventListener('click', function() {
        const url = document.getElementById('imageUrl').value;
        if (!url) return;
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = function() {
            loadedImage = img;
            statusDiv.innerHTML = '✅ Ảnh đã tải thành công (AI nhận diện)';
            // Dùng MobileNet để nhận diện ảnh (fake AI)
            mobilenet.load().then(model => {
                model.classify(img).then(predictions => {
                    if (predictions.length > 0) {
                        statusDiv.innerHTML += ` | Nhận diện: ${predictions[0].className} (${Math.round(predictions[0].probability*100)}%)`;
                    }
                });
            });
        };
        img.onerror = function() {
            statusDiv.innerHTML = '❌ Lỗi tải ảnh, kiểm tra URL hoặc upload file.';
        };
        img.src = url;
    });

    // Upload ảnh từ file
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            const img = new Image();
            img.onload = function() {
                loadedImage = img;
                statusDiv.innerHTML = '✅ Ảnh upload thành công, sẵn sàng AI.';
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });

    // Tạo video giả lập dùng canvas
    function generateFakeVideo() {
        const text = document.getElementById('textInput').value || 'Không có văn bản';
        const action = document.getElementById('actionInput').value || 'không có hiệu ứng';
        const duration = parseFloat(document.getElementById('durationInput').value) || 5;
        const fps = 24;
        const totalFrames = duration * fps;
        canvas.width = 640;
        canvas.height = 480;

        // Nếu không có ảnh, tạo ảnh mặc định
        let baseImg = loadedImage;
        if (!baseImg) {
            const tempImg = new Image();
            tempImg.crossOrigin = 'Anonymous';
            tempImg.src = 'https://picsum.photos/640/480?random=' + Date.now();
            baseImg = tempImg;
            statusDiv.innerHTML = '⚠️ Không có ảnh, dùng ảnh ngẫu nhiên từ Picsum.';
        }

        // Tạo blob video từ canvas (WebM)
        const stream = canvas.captureStream(fps);
        const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
        let chunks = [];

        mediaRecorder.ondataavailable = function(e) {
            if (e.data.size > 0) chunks.push(e.data);
        };

        mediaRecorder.onstop = function() {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            video.src = url;
            video.load();
            video.play();
            downloadBtn.style.display = 'inline-block';
            downloadBtn.onclick = function() {
                const a = document.createElement('a');
                a.href = url;
                a.download = 'AI_video_created.webm';
                a.click();
            };
            statusDiv.innerHTML = '✅ Video AI hoàn tất! (mô phỏng)';
        };

        mediaRecorder.start();

        let frame = 0;
        const interval = setInterval(() => {
            if (frame >= totalFrames || mediaRecorder.state === 'inactive') {
                clearInterval(interval);
                if (mediaRecorder.state === 'recording') mediaRecorder.stop();
                return;
            }
            // Vẽ frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Vẽ ảnh nền với hiệu ứng xoay / bay (mô phỏng)
            const progress = frame / totalFrames;
            const angle = progress * Math.PI * 2; // xoay
            const scale = 1 + 0.3 * Math.sin(progress * Math.PI * 2); // phóng to thu nhỏ

            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.rotate(angle);
            ctx.scale(scale, scale);
            ctx.drawImage(baseImg, -200, -150, 400, 300);
            ctx.restore();

            // Vẽ chữ (văn bản) lên video
            ctx.font = 'bold 28px "Courier New", monospace';
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            const displayText = text.length > 40 ? text.slice(0, 40) + '...' : text;
            ctx.strokeText(displayText, canvas.width/2, canvas.height - 30);
            ctx.fillText(displayText, canvas.width/2, canvas.height - 30);

            // Thêm hiệu ứng hành động mô tả
            ctx.font = '18px monospace';
            ctx.fillStyle = '#ffaa00';
            ctx.shadowBlur = 5;
            ctx.fillText(`⚡ ${action}`, canvas.width/2, 50);

            // Thêm watermark AI
            ctx.font = '14px monospace';
            ctx.fillStyle = '#0ff';
            ctx.shadowBlur = 0;
            ctx.fillText('AI Video Generator (mô phỏng)', 20, canvas.height - 15);

            frame++;
        }, 1000 / fps);
    }

    document.getElementById('generateBtn').addEventListener('click', function() {
        statusDiv.innerHTML = '⏳ AI đang tạo video... (mô phỏng)';
        downloadBtn.style.display = 'none';
        // Nếu chưa có ảnh, thử tải ảnh mặc định
        if (!loadedImage) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = function() {
                loadedImage = img;
                generateFakeVideo();
            };
            img.onerror = function() {
                // Vẫn tạo video với ảnh lỗi, sẽ dùng ảnh mặc định trong generate
                generateFakeVideo();
            };
            img.src = 'https://picsum.photos/640/480?random=' + Date.now();
        } else {
            generateFakeVideo();
        }
    });

    // Khởi tạo sẵn ảnh mẫu
    window.onload = function() {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = function() {
            loadedImage = img;
            statusDiv.innerHTML = '✅ Ảnh mẫu sẵn sàng.';
        };
        img.src = 'https://picsum.photos/640/480?random=1';
    };
</script>
</body>
</html>
